name: Notify

on:
  release:
    types: [published]
  # Releases created with GITHUB_TOKEN don't fire the release event
  workflow_call:
    inputs:
      tag:
        description: Tag of the GitHub release to announce
        required: true
        type: string

jobs:
  resolve-release:
    name: Read release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.release.outputs.name }}
      url: ${{ steps.release.outputs.url }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      body: ${{ steps.release.outputs.body }}
      discord_body: ${{ steps.release.outputs.discord_body }}
    steps:
      - name: Read release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,tagName,url,isPrerelease,body)
          delimiter="EOF_$(uuidgen)"
          {
            echo "name=$(jq -r 'if .name != "" then .name else .tagName end' <<< "$release")"
            echo "url=$(jq -r .url <<< "$release")"
            echo "prerelease=$(jq -r .isPrerelease <<< "$release")"
            echo "body<<$delimiter"
            jq -r .body <<< "$release"
            echo "$delimiter"
            echo "discord_body<<$delimiter"
            # Discord rejects embed descriptions over 4096 characters
            jq -r 'if (.body | length) > 4000 then (.body[0:4000] | sub("\n[^\n]*$"; "")) + "\n\nSee the full notes on GitHub." else .body end' <<< "$release"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  discord_notify:
    name: Send release to Discord
    needs: resolve-release
    if: needs.resolve-release.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post release to Discord (tsickert/discord-webhook)
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASES_STABLE_WEBHOOK }}
          embed-title: ${{ needs.resolve-release.outputs.name }}
          embed-description: ${{ needs.resolve-release.outputs.discord_body }}
          embed-url: ${{ needs.resolve-release.outputs.url }}
          wait: true

  slack_release_notify:
    name: Send release to Slack
    needs: resolve-release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send Slack release notification
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "message": ${{ toJSON(format('[Tiptap Editor {0}]: {1}{4}Release title: {2}{4}{3}', needs.resolve-release.outputs.prerelease == 'true' && 'Pre-release' || 'Release', needs.resolve-release.outputs.name, needs.resolve-release.outputs.url, needs.resolve-release.outputs.body || 'No release notes provided.', fromJSON('"\n"'))) }}
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
