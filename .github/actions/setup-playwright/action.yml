name: Setup Playwright
description: Cache the Playwright Chromium headless shell and install it with system dependencies on a cache miss

runs:
  using: composite
  steps:
    - name: Get Playwright version
      id: playwright-version
      shell: bash
      run: |
        version=$(node -p 'require("@playwright/test/package.json").version')
        # An empty version would let all Playwright versions share one cache
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid Playwright version: $version" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        # Keep shell-only caches apart from older full Chromium caches
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-headless-shell

    # The runner image already has Chromium's libraries, so a cache hit skips the slow apt install
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: vp exec playwright install --with-deps --only-shell chromium
