name: Setup Vite+ environment
description: Install Vite+, set up Node.js and dependency caching, and optionally install dependencies

inputs:
  node-version:
    description: Node.js version
    required: true
  cache:
    description: Whether to cache package manager data
    default: 'false'
    required: false
  install:
    description: Whether to install dependencies with a frozen lockfile and strict peer dependencies
    default: 'false'
    required: false

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@v1.18.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'false'
        run-install: >-
          ${{ inputs.install == 'true'
          && '{ args: ["--prefer-offline", "--frozen-lockfile", "--", "--strict-peer-dependencies"] }'
          || 'false' }}
